
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 90%;
      max-width: 680px;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2.2rem;
    }

    p {
      opacity: 0.65;
      margin-bottom: 32px;
    }

    .links {
      display: grid;
      gap: 16px;
    }

    a {
      display: block;
      padding: 18px 22px;
      border: 1px solid #444;
      border-radius: 14px;
      color: #f2f2f2;
      text-decoration: none;
      font-size: 1.15rem;
      background: #1a1a1a;
    }

    a:hover {
      background: #252525;
    }

    .small {
      margin-top: 28px;
      font-size: 0.8rem;
      opacity: 0.35;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Personal Dashboard</h1>
    <p>Small tools for avoiding chaos. Allegedly.</p>

    <div class="links">
      <a href="Open_Obsidian/">Open Obsidian</a>
      <a href="quote_widget/">Daily Quote</a>
    </div>

    <div class="small">Built because apparently normal bookmarks were too emotionally available.</div>
  </main>
</body>
</html>
