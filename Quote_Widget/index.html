<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Daily Quote</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #f2f2f2;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 720px;
      padding: 32px;
      text-align: center;
    }

    .quote {
      font-size: clamp(0.5rem, 3vw, 3.5rem);
      line-height: 1.25;
      font-weight: 650;
    }

    .category {
      margin-top: 24px;
      font-size: clamp(0.2rem, 1vw, 0.85rem);
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      opacity: 0.35;
    }
  </style>
</head>

<body>
  <main class="card">
    <div id="quote" class="quote">Loading...</div>
    <div id="category" class="category"></div>
    <div class="hint">tap refresh if life remains disappointing</div>
  </main>

  <script>
    async function loadQuote() {
      const response = await fetch("quotes.json");
      const quotes = await response.json();

      if (!quotes.length) {
        document.getElementById("quote").textContent = "No quotes found.";
        return;
      }

      const randomIndex = Math.floor(Math.random() * quotes.length);
      const selected = quotes[randomIndex];

      document.getElementById("quote").textContent = selected.text;
      document.getElementById("category").textContent = selected.category;
    }

    loadQuote();
  </script>
</body>
</html>
